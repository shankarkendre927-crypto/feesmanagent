    // 1. INDEXED-DB PERSISTENCE ENGINE (No 5MB LocalStorage Limit)
    // -------------------------------------------------------------
    const DB_NAME = "AbhyasikaProSaaSDB";
    const DB_VERSION = 1;
    let dbInstance = null;

    function initDatabase() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, DB_VERSION);
        req.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains("tenants")) db.createObjectStore("tenants", { keyPath: "id" });
          if (!db.objectStoreNames.contains("students")) db.createObjectStore("students", { keyPath: "id" });
          if (!db.objectStoreNames.contains("staff")) db.createObjectStore("staff", { keyPath: "id" });
          if (!db.objectStoreNames.contains("settings")) db.createObjectStore("settings", { keyPath: "key" });
        };
        req.onsuccess = (e) => {
          dbInstance = e.target.result;
          seedInitialData().then(resolve);
        };
        req.onerror = (e) => reject(e.target.error);
      });
    }

    function dbPut(storeName, item) {
      return new Promise((resolve, reject) => {
        const tx = dbInstance.transaction(storeName, "readwrite");
        tx.objectStore(storeName).put(item);
        tx.oncomplete = () => resolve(true);
        tx.onerror = (e) => reject(e.target.error);
      });
    }

    function dbGetAll(storeName) {
      return new Promise((resolve, reject) => {
        const tx = dbInstance.transaction(storeName, "readonly");
        const req = tx.objectStore(storeName).getAll();
        req.onsuccess = () => resolve(req.result || []);
        req.onerror = (e) => reject(e.target.error);
      });
    }

    function dbGet(storeName, key) {
      return new Promise((resolve, reject) => {
        const tx = dbInstance.transaction(storeName, "readonly");
        const req = tx.objectStore(storeName).get(key);
        req.onsuccess = () => resolve(req.result);
        req.onerror = (e) => reject(e.target.error);
      });
    }

    function dbDelete(storeName, key) {
      return new Promise((resolve, reject) => {
        const tx = dbInstance.transaction(storeName, "readwrite");
        tx.objectStore(storeName).delete(key);
        tx.oncomplete = () => resolve(true);
        tx.onerror = (e) => reject(e.target.error);
      });
    }

    // -------------------------------------------------------------
    // 4. PASSPORT PHOTO CANVAS COMPRESSION (Prevents Quota Bloat)
    // -------------------------------------------------------------
    function compressImageFile(file, maxWidth = 150, maxHeight = 150) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement("canvas");
            let width = img.width;
            let height = img.height;

            if (width > height) {
              if (width > maxWidth) {
                height = Math.round((height * maxWidth) / width);
                width = maxWidth;
              }
            } else {
              if (height > maxHeight) {
                width = Math.round((width * maxHeight) / height);
                height = maxHeight;
              }
            }

            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL("image/jpeg", 0.8)); // crisp ~20-30KB passport photo
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

      else if (viewName === "forgot_password") renderForgotPasswordView(container);
      else if (viewName === "super_admin") renderSuperAdminView(container);
      else if (viewName === "tenant_dashboard") renderTenantDashboard(container);
      else if (viewName === "paywall") renderPaywallView(container, params);
      else if (viewName === "readonly_export") renderReadOnlyExportView(container, params);
